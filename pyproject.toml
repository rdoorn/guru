[project]
name = "guru"
version = "0.1.0"
description = "Local Ollama chat agent with on-demand tool directory"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.14.4",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "prompt-toolkit>=3.0.53",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
# Encoder judges (guru/judges/encoder.py, guru/judges/decide.py). Heavy
# (~1 GB of wheels):
#   uv sync --extra judge
# transformers stays below 5: gliner2 2.x (the decide judge) requires it
# (which also holds huggingface-hub below 1).
judge = [
    "torch>=2.5",
    "transformers>=4.45,<5",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "gliner2[local]>=2.0,<3",
]

[tool.uv]
exclude-newer = "2026-08-06T00:00:00Z"
# gliner2 2.0.0 (2026-08-24) is the first release with the GLiNER2.5
# models' API; only it is allowed past the global cutoff.
exclude-newer-package = { gliner2 = "2026-08-25T00:00:00Z" }

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
files = ["guru"]
ignore_missing_imports = true
warn_unused_ignores = true
# Pragmatic: this codebase is intentionally lightly annotated; we want mypy to
# catch real errors, not force annotations everywhere.
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]      # evals/fixtures/* carry their own (one failing) tests
markers = [
    "sandbox: builds and runs containers against the local Colima; excluded by `make test`, run with `make test-sandbox`",
]
