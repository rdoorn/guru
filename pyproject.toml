[project]
name = "guru"
version = "0.1.0"
description = "Local Ollama chat agent with on-demand tool directory"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.14.4",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "openai>=2.53.0",
    "prompt-toolkit>=3.0.53",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[tool.uv]
exclude-newer = "2026-08-06T00:00:00Z"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
files = ["guru"]
ignore_missing_imports = true
warn_unused_ignores = true
# Pragmatic: this codebase is intentionally lightly annotated; we want mypy to
# catch real errors, not force annotations everywhere.
check_untyped_defs = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
