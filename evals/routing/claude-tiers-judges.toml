# Config 2: claude-tiers plus the small local judges in shadow mode.
#
# Same [routing] as claude-tiers.toml. The [decisions] table installs the
# encoder judges for the run (data collection only: in "shadow" mode a
# judge's verdict is logged in the ledger `decisions` stream next to the
# heuristic's and never changes behaviour). No sidecar LLM judge is
# configured; the panel and injection judges need the judge extra
# (`uv sync --extra judge`) — without it they are skipped with a log line
# and the run records no judges.

[routing]
mode = "local-and-remote"
controller = true
complexity_router = true
type_router = false
spend_confirm = "auto"
secret_scan = true

[[routing.ladder]]
adapter = "SBP Litellm"
model = "aws/claude-4-5-haiku"
max_complexity = "trivial"

[[routing.ladder]]
adapter = "SBP Litellm"
model = "aws/claude-5-sonnet"
max_complexity = "standard"
default = true

[[routing.ladder]]
adapter = "SBP Litellm"
model = "aws/claude-5-5-opus"
max_complexity = "hard"

[decisions]
mode = "shadow"

[decisions.points]
panel = "encoder"
injection = "injection"
