# Config 4: claude-tiers-judges plus the panel judge ACTIVE and the review
# ladder — the shape the default block written on first run has.
#
# Differences from claude-tiers-judges.toml: `panel = true` under
# [decisions.active], so for a review-kind task whose `needs_security`
# answer is yes and that spawned no security worker, the orchestrator adds
# one (tasks row `origin = "panel"`); `type_router = true` with a
# `[[routing.ladders.review]]` ladder that starts at Sonnet. Used to
# measure the panel security worker on `review-multi-file`
# (docs/plans/2026-09-25-improve-loop.md, package C).

[routing]
mode = "local-and-remote"
controller = true
complexity_router = true
type_router = true
spend_confirm = "auto"
secret_scan = true

[[routing.ladder]]
adapter = "SBP Litellm"
model = "aws/claude-4-5-haiku"
max_complexity = "trivial"

[[routing.ladder]]
adapter = "SBP Litellm"
model = "aws/claude-5-sonnet"
max_complexity = "standard"
default = true

[[routing.ladder]]
adapter = "SBP Litellm"
model = "aws/claude-5-5-opus"
max_complexity = "hard"

[[routing.ladders.review]]
adapter = "SBP Litellm"
model = "aws/claude-5-sonnet"
max_complexity = "standard"
default = true

[[routing.ladders.review]]
adapter = "SBP Litellm"
model = "aws/claude-5-5-opus"
max_complexity = "hard"

[decisions]
mode = "active"
labels_margin = 0.15

[decisions.points]
panel = "encoder"
injection = "injection"
labels = "encoder"

[decisions.active]
labels = true
panel = true
