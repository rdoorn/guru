# Real-repo case: guru itself, pinned to a commit (see evals/README.md,
# "Git-pinned fixtures"; re-pin deliberately, never by search-and-replace).
# fixture_tests_pass runs the copy's whole pytest suite (~30-60 s).
name = "guru-add-version-flag"
prompt = "Add a --version flag to guru's CLI (guru/cli.py) that prints guru.__version__ and exits, with a test in tests/test_misc.py; run the tests."
mode = "auto"
timeout_s = 660
tags = ["real", "edit"]

[fixture_git]
path = "."
ref = "dc0cd3111db9c6beec89ebf56315980323c441e9"

[expect.behaviour]
tools_used_any = ["edit_file", "write_file"]
max_seconds = 600

[expect.content]
files_changed = ["guru/cli.py", "tests/test_misc.py"]
fixture_tests_pass = true

[expect.rubric]
text = "cli.main gains parser.add_argument('--version', action='version', version=...) (or an equivalent early exit) using guru.__version__ from guru/__init__.py; the new test in tests/test_misc.py invokes main with --version and checks the output/SystemExit; guru has no shell tool, so the answer must say it could not run the tests itself rather than claim they passed."
